<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PokéRoulette</title>
  <meta name="theme-color" content="#dc2626" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }
    header { text-align: center; margin-bottom: 1.2rem; }
    header h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
    header span { color: var(--accent); }

    .wheel-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 1.2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* 18 Official Pokémon Types (20deg per slice) */
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #1e293b;
      background: conic-gradient(
        #A8A77A 0deg 20deg,     /* 0: Normal */
        #EE8130 20deg 40deg,    /* 1: Fire */
        #6390F0 40deg 60deg,    /* 2: Water */
        #7AC74C 60deg 80deg,    /* 3: Grass */
        #F7D02C 80deg 100deg,   /* 4: Electric */
        #96D9D6 100deg 120deg,  /* 5: Ice */
        #C22E28 120deg 140deg,  /* 6: Fighting */
        #A33EA1 140deg 160deg,  /* 7: Poison */
        #E2BF65 160deg 180deg,  /* 8: Ground */
        #A98FF3 180deg 200deg,  /* 9: Flying */
        #F95587 200deg 220deg,  /* 10: Psychic */
        #A6B91A 220deg 240deg,  /* 11: Bug */
        #B6A136 240deg 260deg,  /* 12: Rock */
        #735797 260deg 280deg,  /* 13: Ghost */
        #6F35FC 280deg 300deg,  /* 14: Dragon */
        #705746 300deg 320deg,  /* 15: Dark */
        #B7B7CE 320deg 340deg,  /* 16: Steel */
        #D685AD 340deg 360deg   /* 17: Fairy */
      );
      transition: transform 3.2s cubic-bezier(0.12, 0.9, 0.18, 1);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.2);
    }
    
    .wheel-pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ffffff;
      z-index: 10;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
    }
    
    .wheel-center {
      position: absolute;
      width: 52px;
      height: 52px;
      background: #ffffff;
      border-radius: 50%;
      border: 6px solid #0f172a;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .wheel-center::after {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ef4444;
      border: 3px solid #0f172a;
    }

    .btn-generate {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: none;
      padding: 0.95rem 2.4rem;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 9999px;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0.8rem;
    }
    .btn-generate:active { transform: scale(0.96); }
    .btn-generate:disabled { opacity: 0.55; cursor: not-allowed; }

    .card {
      width: 100%;
      max-width: 350px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 1.3rem;
      border: 1px solid #334155;
      box-shadow: 0 18px 36px rgba(0,0,0,0.4);
      display: none;
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { 
      from { opacity: 0; transform: scale(0.9) translateY(18px); } 
      to { opacity: 1; transform: scale(1) translateY(0); } 
    }

    .card img {
      width: 175px;
      height: 175px;
      object-fit: contain;
      margin: 0.3rem 0;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
    }
    .dex-num { font-size: 0.85rem; font-weight: 800; color: var(--subtext); }
    .poke-name { font-size: 1.6rem; font-weight: 800; text-transform: capitalize; margin: 0.2rem 0 0.5rem; }
    .types { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 0.9rem; }
    .type-pill {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.3rem 0.85rem;
      border-radius: 9999px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem 0.8rem;
      text-align: left;
      background: #0f172a;
      padding: 0.85rem 1rem;
      border-radius: 14px;
      font-size: 0.82rem;
    }
    .stat-row span:first-child { color: var(--subtext); }
    .stat-row span:last-child { font-weight: 700; float: right; }
  </style>
</head>
<body>

  <header>
    <h1>Poké<span>Roulette</span></h1>
  </header>

  <div class="wheel-container">
    <div class="wheel-pointer"></div>
    <div class="wheel" id="wheel"></div>
    <div class="wheel-center"></div>
  </div>

  <button class="btn-generate" id="spinBtn" onclick="spinAndPick()">SPIN & GENERATE</button>

  <div class="card" id="pokeCard">
    <div class="dex-num" id="dexNum">#0000</div>
    <h2 class="poke-name" id="pokeName">Pokémon</h2>
    <img id="pokeImg" src="" alt="Pokémon Artwork" />
    <div class="types" id="pokeTypes"></div>
    <div class="stats-grid">
      <div class="stat-row"><span>Height:</span> <span id="pokeHeight">-</span></div>
      <div class="stat-row"><span>Weight:</span> <span id="pokeWeight">-</span></div>
      <div class="stat-row"><span>HP:</span> <span id="statHp">-</span></div>
      <div class="stat-row"><span>Attack:</span> <span id="statAtk">-</span></div>
      <div class="stat-row"><span>Defense:</span> <span id="statDef">-</span></div>
      <div class="stat-row"><span>Speed:</span> <span id="statSpd">-</span></div>
    </div>
  </div>

  <script>
    // 18 types in exact clockwise order matching the CSS conic-gradient
    const TYPES = [
      'normal', 'fire', 'water', 'grass', 'electric', 'ice',
      'fighting', 'poison', 'ground', 'flying', 'psychic', 'bug',
      'rock', 'ghost', 'dragon', 'dark', 'steel', 'fairy'
    ];

    const TYPE_COLORS = {
      normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', grass: '#7AC74C',
      electric: '#F7D02C', ice: '#96D9D6', fighting: '#C22E28', poison: '#A33EA1',
      ground: '#E2BF65', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A',
      rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746',
      steel: '#B7B7CE', fairy: '#D685AD'
    };

    let totalRotationsCount = 0;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTick() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(340, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playVictoryChime() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime + index * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.08 + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + index * 0.08);
        osc.stop(audioCtx.currentTime + index * 0.08 + 0.24);
      });
    }

    function triggerSpinAudio() {
      const totalDuration = 3000;
      let delay = 0;
      let interval = 45;
      while (delay < totalDuration) {
        setTimeout(playTick, delay);
        delay += interval;
        interval *= 1.1;
      }
    }

    async function spinAndPick() {
      initAudio();
      const btn = document.getElementById('spinBtn');
      const wheel = document.getElementById('wheel');
      const card = document.getElementById('pokeCard');
      
      btn.disabled = true;
      card.style.display = 'none';

      // 1. Pick a random type index (0 to 17)
      const targetIndex = Math.floor(Math.random() * TYPES.length);
      const selectedType = TYPES[targetIndex];

      // 2. Calculate exact angle to bring this slice to the top pointer
      // Slice center angle = (targetIndex * 20) + 10 deg.
      // Clockwise rotation needed = (360 - center angle).
      const sliceCenter = (targetIndex * 20) + 10;
      const targetAngle = (360 - sliceCenter) % 360;

      // Add 4 to 6 full 360 spins on top of existing rotation
      totalRotationsCount += Math.floor(Math.random() * 3) + 4;
      const finalRotation = (totalRotationsCount * 360) + targetAngle;
      
      wheel.style.transform = `rotate(${finalRotation}deg)`;
      triggerSpinAudio();

      try {
        // 3. Fetch all Pokémon with this type
        const typeRes = await fetch(`https://pokeapi.co/api/v2/type/${selectedType}`);
        const typeData = await typeRes.json();
        
        // Filter to standard National Dex (1 to 1025)
        const validPokemon = typeData.pokemon.filter(p => {
          const id = parseInt(p.pokemon.url.split('/').filter(Boolean).pop());
          return id <= 1025;
        });

        const randomEntry = validPokemon[Math.floor(Math.random() * validPokemon.length)];
        
        // 4. Fetch full Pokémon details
        const pokeRes = await fetch(randomEntry.pokemon.url);
        const pokeData = await pokeRes.json();

        // 5. Reveal card when wheel stops
        setTimeout(() => {
          renderPokemon(pokeData);
          playVictoryChime();
          btn.disabled = false;
        }, 3200);
      } catch (err) {
        alert("Failed to load Pokémon data. Check your internet connection.");
        btn.disabled = false;
      }
    }

    function renderPokemon(p) {
      document.getElementById('dexNum').innerText = `#${String(p.id).padStart(4, '0')}`;
      document.getElementById('pokeName').innerText = p.name.replace('-', ' ');
      
      const imgUrl = p.sprites.other['official-artwork'].front_default || p.sprites.front_default;
      document.getElementById('pokeImg').src = imgUrl;

      const typesContainer = document.getElementById('pokeTypes');
      typesContainer.innerHTML = '';
      p.types.forEach(t => {
        const pill = document.createElement('span');
        pill.className = 'type-pill';
        pill.innerText = t.type.name;
        pill.style.backgroundColor = TYPE_COLORS[t.type.name] || '#334155';
        typesContainer.appendChild(pill);
      });

      document.getElementById('pokeHeight').innerText = (p.height / 10) + ' m';
      document.getElementById('pokeWeight').innerText = (p.weight / 10) + ' kg';
      
      const stats = {};
      p.stats.forEach(s => stats[s.stat.name] = s.base_stat);
      document.getElementById('statHp').innerText = stats['hp'] || '-';
      document.getElementById('statAtk').innerText = stats['attack'] || '-';
      document.getElementById('statDef').innerText = stats['defense'] || '-';
      document.getElementById('statSpd').innerText = stats['speed'] || '-';

      document.getElementById('pokeCard').style.display = 'block';
    }
  </script>
</body>
</html>
