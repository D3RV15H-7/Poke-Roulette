<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PokéRoulette</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <meta name="theme-color" content="#dc2626" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      touch-action: pan-y;
    }
    header { text-align: center; margin-bottom: 0.8rem; }
    header h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
    header span { color: var(--accent); }

    .counter-badge {
      display: inline-block;
      margin-top: 0.3rem;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--subtext);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.8rem;
      border-radius: 9999px;
    }
    .counter-badge strong { color: var(--green); }

    /* Search & Autocomplete Container */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin-top: 0.8rem;
      margin-bottom: 0.4rem;
      z-index: 20;
    }
    .search-container {
      display: flex;
      gap: 0.4rem;
      width: 100%;
    }
    .search-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 0.65rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
    }
    .search-input::placeholder {
      color: #64748b;
    }
    .btn-search {
      background: #334155;
      color: white;
      border: none;
      padding: 0 1.1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-search:active {
      background: #475569;
    }

    /* Live Suggestions Dropdown */
    .suggestions-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      max-height: 220px;
      overflow-y: auto;
      list-style: none;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .suggestions-list li {
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      border-bottom: 1px solid #2d3748;
      cursor: pointer;
      text-transform: capitalize;
    }
    .suggestions-list li:last-child {
      border-bottom: none;
    }
    .suggestions-list li:active, .suggestions-list li:hover {
      background: #334155;
    }
    .sugg-num {
      color: var(--subtext);
      font-weight: 700;
      margin-right: 0.5rem;
    }
    .sugg-tick {
      color: var(--green);
      font-weight: 900;
    }

    .wheel-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0.8rem auto 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #1e293b;
      background: conic-gradient(
        #A8A77A 0deg 20deg,
        #EE8130 20deg 40deg,
        #6390F0 40deg 60deg,
        #7AC74C 60deg 80deg,
        #F7D02C 80deg 100deg,
        #96D9D6 100deg 120deg,
        #C22E28 120deg 140deg,
        #A33EA1 140deg 160deg,
        #E2BF65 160deg 180deg,
        #A98FF3 180deg 200deg,
        #F95587 200deg 220deg,
        #A6B91A 220deg 240deg,
        #B6A136 240deg 260deg,
        #735797 260deg 280deg,
        #6F35FC 280deg 300deg,
        #705746 300deg 320deg,
        #B7B7CE 320deg 340deg,
        #D685AD 340deg 360deg
      );
      transition: transform 3.2s cubic-bezier(0.12, 0.9, 0.18, 1);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.2);
    }
    
    .wheel-pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ffffff;
      z-index: 10;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
    }
    
    .wheel-center {
      position: absolute;
      width: 52px;
      height: 52px;
      background: #ffffff;
      border-radius: 50%;
      border: 6px solid #0f172a;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .wheel-center::after {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ef4444;
      border: 3px solid #0f172a;
    }

    .btn-generate {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: none;
      padding: 0.9rem 2.4rem;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 9999px;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0.8rem;
    }
    .btn-generate:active { transform: scale(0.96); }
    .btn-generate:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Card & Navigation Headers */
    .card {
      width: 100%;
      max-width: 350px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 1.2rem;
      border: 1px solid #334155;
      box-shadow: 0 18px 36px rgba(0,0,0,0.4);
      display: none;
      text-align: center;
      user-select: none;
      touch-action: pan-y;
      transition: transform 0.15s ease-out;
    }
    .card.slide-in-right {
      animation: slideInRight 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card.slide-in-left {
      animation: slideInLeft 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .card-top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
    }
    .nav-arrow {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 1.2rem;
      font-weight: 900;
      padding: 0 0.5rem;
      cursor: pointer;
      transition: color 0.15s;
    }
    .nav-arrow:active {
      color: #fff;
    }

    .image-container {
      position: relative;
      display: inline-block;
      margin: 0.2rem 0;
    }
    .card img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
      pointer-events: none;
    }
    
    .collected-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--green);
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.5);
      border: 2px solid #ffffff;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.25s ease;
    }
    .collected-badge.active {
      opacity: 1;
      transform: scale(1);
    }

    .dex-num { font-size: 0.85rem; font-weight: 800; color: var(--subtext); }
    .poke-name { font-size: 1.55rem; font-weight: 800; text-transform: capitalize; margin: 0.2rem 0 0.4rem; }
    .types { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 0.7rem; }
    .type-pill {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.25rem 0.8rem;
      border-radius: 9999px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .btn-collect {
      width: 100%;
      padding: 0.65rem;
      margin-bottom: 0.8rem;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--subtext);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn-collect.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--green);
      color: var(--green);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem 0.8rem;
      text-align: left;
      background: #0f172a;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      font-size: 0.8rem;
    }
    .stat-row span:first-child { color: var(--subtext); }
    .stat-row span:last-child { font-weight: 700; float: right; }
  </style>
</head>
<body>

  <header>
    <h1>Poké<span>Roulette</span></h1>
    <div class="counter-badge">Collected: <strong id="totalCollectedCount">0</strong> / 1025</div>
  </header>

  <div class="search-wrapper">
    <form class="search-container" onsubmit="event.preventDefault(); submitSearch();">
      <input type="text" id="searchInput" class="search-input" placeholder="Type Pokémon Name or Dex #" autocomplete="off" oninput="handleSearchInput(this.value)" />
      <button type="submit" class="btn-search">Search</button>
    </form>
    <ul class="suggestions-list" id="suggestionsList"></ul>
  </div>

  <div class="wheel-container">
    <div class="wheel-pointer"></div>
    <div class="wheel" id="wheel"></div>
    <div class="wheel-center"></div>
  </div>

  <button class="btn-generate" id="spinBtn" onclick="spinAndPick()">SPIN & GENERATE</button>

  <div class="card" id="pokeCard">
    <div class="card-top-nav">
      <button class="nav-arrow" onclick="navigateDex(-1)" title="Previous Pokémon">‹</button>
      <div class="dex-num" id="dexNum">#0000</div>
      <button class="nav-arrow" onclick="navigateDex(1)" title="Next Pokémon">›</button>
    </div>

    <h2 class="poke-name" id="pokeName">Pokémon</h2>
    
    <div class="image-container">
      <img id="pokeImg" src="" alt="Pokémon Artwork" />
      <div class="collected-badge" id="cardTickBadge">✓</div>
    </div>
    
    <div class="types" id="pokeTypes"></div>
    
    <button class="btn-collect" id="collectToggleBtn" onclick="toggleCollectionStatus()">
      <span id="collectBtnIcon">+</span> <span id="collectBtnText">Add to Collection</span>
    </button>

    <div class="stats-grid">
      <div class="stat-row"><span>Height:</span> <span id="pokeHeight">-</span></div>
      <div class="stat-row"><span>Weight:</span> <span id="pokeWeight">-</span></div>
      <div class="stat-row"><span>HP:</span> <span id="statHp">-</span></div>
      <div class="stat-row"><span>Attack:</span> <span id="statAtk">-</span></div>
      <div class="stat-row"><span>Defense:</span> <span id="statDef">-</span></div>
      <div class="stat-row"><span>Speed:</span> <span id="statSpd">-</span></div>
    </div>
  </div>

  <script>
    const TOTAL_POKEMON = 1025;
    const TYPES = [
      'normal', 'fire', 'water', 'grass', 'electric', 'ice',
      'fighting', 'poison', 'ground', 'flying', 'psychic', 'bug',
      'rock', 'ghost', 'dragon', 'dark', 'steel', 'fairy'
    ];

    const TYPE_COLORS = {
      normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', grass: '#7AC74C',
      electric: '#F7D02C', ice: '#96D9D6', fighting: '#C22E28', poison: '#A33EA1',
      ground: '#E2BF65', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A',
      rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746',
      steel: '#B7B7CE', fairy: '#D685AD'
    };

    let pokemonDirectory = [];
    let totalRotationsCount = 0;
    let audioCtx = null;
    let currentPokemonId = null;

    async function loadDirectory() {
      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=${TOTAL_POKEMON}`);
        const data = await res.json();
        pokemonDirectory = data.results.map((p, idx) => ({
          id: idx + 1,
          name: p.name
        }));
      } catch (err) {
        console.error("Directory load failed", err);
      }
    }

    function getCollectedSet() {
      const saved = localStorage.getItem('poke_collection');
      return saved ? new Set(JSON.parse(saved)) : new Set();
    }

    function saveCollectedSet(set) {
      localStorage.setItem('poke_collection', JSON.stringify(Array.from(set)));
      updateTotalCountUI();
    }

    function updateTotalCountUI() {
      const set = getCollectedSet();
      document.getElementById('totalCollectedCount').innerText = set.size;
    }

    function toggleCollectionStatus() {
      if (!currentPokemonId) return;
      const set = getCollectedSet();
      if (set.has(currentPokemonId)) {
        set.delete(currentPokemonId);
      } else {
        set.add(currentPokemonId);
        playTick();
      }
      saveCollectedSet(set);
      updateCollectionButtonUI(set.has(currentPokemonId));
    }

    function updateCollectionButtonUI(isOwned) {
      const btn = document.getElementById('collectToggleBtn');
      const badge = document.getElementById('cardTickBadge');
      const icon = document.getElementById('collectBtnIcon');
      const text = document.getElementById('collectBtnText');

      if (isOwned) {
        btn.classList.add('active');
        badge.classList.add('active');
        icon.innerText = '✓';
        text.innerText = 'In Collection (Tap to remove)';
      } else {
        btn.classList.remove('active');
        badge.classList.remove('active');
        icon.innerText = '+';
        text.innerText = 'Add to Collection';
      }
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTick() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(340, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playVictoryChime() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime + index * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.08 + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + index * 0.08);
        osc.stop(audioCtx.currentTime + index * 0.08 + 0.24);
      });
    }

    function triggerSpinAudio() {
      const totalDuration = 3000;
      let delay = 0;
      let interval = 45;
      while (delay < totalDuration) {
        setTimeout(playTick, delay);
        delay += interval;
        interval *= 1.1;
      }
    }

    function alignWheelToType(typeName) {
      const targetIndex = TYPES.indexOf(typeName);
      if (targetIndex === -1) return;
      const sliceCenter = (targetIndex * 20) + 10;
      const targetAngle = (360 - sliceCenter) % 360;
      totalRotationsCount += 1;
      const finalRotation = (totalRotationsCount * 360) + targetAngle;
      document.getElementById('wheel').style.transform = `rotate(${finalRotation}deg)`;
    }

    function handleSearchInput(rawVal) {
      const list = document.getElementById('suggestionsList');
      const val = rawVal.trim().toLowerCase().replace('#', '');
      if (!val || pokemonDirectory.length === 0) {
        list.style.display = 'none';
        return;
      }

      const numVal = parseInt(val, 10);
      const isNum = !isNaN(numVal);
      const collectedSet = getCollectedSet();

      const matches = pokemonDirectory.filter(p => {
        if (isNum) {
          return p.id === numVal || String(p.id).startsWith(val);
        }
        return p.name.toLowerCase().includes(val);
      }).slice(0, 7);

      if (matches.length === 0) {
        list.style.display = 'none';
        return;
      }

      list.innerHTML = '';
      matches.forEach(p => {
        const li = document.createElement('li');
        const isCollected = collectedSet.has(p.id);
        li.innerHTML = `
          <span><span class="sugg-num">#${String(p.id).padStart(4, '0')}</span>${p.name.replace('-', ' ')}</span>
          ${isCollected ? '<span class="sugg-tick">✓</span>' : ''}
        `;
        li.onmousedown = () => selectPokemonById(p.id);
        list.appendChild(li);
      });

      list.style.display = 'block';
    }

    async function selectPokemonById(id, direction = 0) {
      const list = document.getElementById('suggestionsList');
      const input = document.getElementById('searchInput');
      list.style.display = 'none';
      if (input) { input.value = ''; input.blur(); }

      initAudio();
      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        const data = await res.json();
        alignWheelToType(data.types[0].type.name);
        renderPokemon(data, direction);
      } catch (err) {
        console.error("Failed to load Pokémon details.", err);
      }
    }

    function navigateDex(delta) {
      if (!currentPokemonId) return;
      let nextId = currentPokemonId + delta;
      if (nextId < 1) nextId = TOTAL_POKEMON;
      if (nextId > TOTAL_POKEMON) nextId = 1;
      selectPokemonById(nextId, delta);
    }

    // Touch Swipe Gesture Detection on Card
    const cardEl = document.getElementById('pokeCard');
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    cardEl.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    cardEl.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleCardSwipe();
    }, { passive: true });

    function handleCardSwipe() {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      
      // Ensure horizontal swipe is dominant and exceeds minimum threshold (45px)
      if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
        if (deltaX < 0) {
          // Swiped Left -> Forward
          navigateDex(1);
        } else {
          // Swiped Right -> Backward
          navigateDex(-1);
        }
      }
    }

    function submitSearch() {
      const list = document.getElementById('suggestionsList');
      const firstItem = list.querySelector('li');
      if (firstItem) {
        firstItem.onmousedown();
      } else {
        const input = document.getElementById('searchInput').value;
        handleSearchInput(input);
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        document.getElementById('suggestionsList').style.display = 'none';
      }
    });

    async function spinAndPick() {
      initAudio();
      document.getElementById('suggestionsList').style.display = 'none';
      const btn = document.getElementById('spinBtn');
      const wheel = document.getElementById('wheel');
      const card = document.getElementById('pokeCard');
      
      btn.disabled = true;
      card.style.display = 'none';

      const targetIndex = Math.floor(Math.random() * TYPES.length);
      const selectedType = TYPES[targetIndex];

      const sliceCenter = (targetIndex * 20) + 10;
      const targetAngle = (360 - sliceCenter) % 360;

      totalRotationsCount += Math.floor(Math.random() * 3) + 4;
      const finalRotation = (totalRotationsCount * 360) + targetAngle;
      
      wheel.style.transform = `rotate(${finalRotation}deg)`;
      triggerSpinAudio();

      try {
        const typeRes = await fetch(`https://pokeapi.co/api/v2/type/${selectedType}`);
        const typeData = await typeRes.json();
        
        const validPokemon = typeData.pokemon.filter(p => {
          const id = parseInt(p.pokemon.url.split('/').filter(Boolean).pop());
          return id <= TOTAL_POKEMON;
        });

        const randomEntry = validPokemon[Math.floor(Math.random() * validPokemon.length)];
        
        const pokeRes = await fetch(randomEntry.pokemon.url);
        const pokeData = await pokeRes.json();

        setTimeout(() => {
          renderPokemon(pokeData);
          playVictoryChime();
          btn.disabled = false;
        }, 3200);
      } catch (err) {
        alert("Failed to load Pokémon data. Check your internet connection.");
        btn.disabled = false;
      }
    }

    function renderPokemon(p, direction = 0) {
      currentPokemonId = p.id;
      const card = document.getElementById('pokeCard');
      
      // Reset animation classes
      card.classList.remove('slide-in-right', 'slide-in-left');
      if (direction > 0) {
        card.classList.add('slide-in-right');
      } else if (direction < 0) {
        card.classList.add('slide-in-left');
      }

      document.getElementById('dexNum').innerText = `#${String(p.id).padStart(4, '0')}`;
      document.getElementById('pokeName').innerText = p.name.replace('-', ' ');
      
      const imgUrl = p.sprites.other['official-artwork'].front_default || p.sprites.front_default;
      document.getElementById('pokeImg').src = imgUrl;

      const typesContainer = document.getElementById('pokeTypes');
      typesContainer.innerHTML = '';
      p.types.forEach(t => {
        const pill = document.createElement('span');
        pill.className = 'type-pill';
        pill.innerText = t.type.name;
        pill.style.backgroundColor = TYPE_COLORS[t.type.name] || '#334155';
        typesContainer.appendChild(pill);
      });

      document.getElementById('pokeHeight').innerText = (p.height / 10) + ' m';
      document.getElementById('pokeWeight').innerText = (p.weight / 10) + ' kg';
      
      const stats = {};
      p.stats.forEach(s => stats[s.stat.name] = s.base_stat);
      document.getElementById('statHp').innerText = stats['hp'] || '-';
      document.getElementById('statAtk').innerText = stats['attack'] || '-';
      document.getElementById('statDef').innerText = stats['defense'] || '-';
      document.getElementById('statSpd').innerText = stats['speed'] || '-';

      const set = getCollectedSet();
      updateCollectionButtonUI(set.has(p.id));

      card.style.display = 'block';
    }

    loadDirectory();
    updateTotalCountUI();
  </script>
</body>
</html>
