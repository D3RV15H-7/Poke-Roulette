<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PokéRoulette</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --red: #ef4444; --text: #f8fafc; --sub: #94a3b8; --green: #10b981; --gold: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: clamp(0.2rem, 0.5dvh, 0.4rem) clamp(0.5rem, 2vw, 0.8rem); touch-action: pan-y; }
    
    .viewport { 
      width: 100%; 
      max-width: 400px; 
      height: 100%; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      gap: clamp(0.1rem, 0.3dvh, 0.2rem); 
      transition: justify-content 0.4s ease;
    }
    body.has-active .viewport { justify-content: flex-start; }
    
    header { width: 100%; text-align: center; flex-shrink: 0; }
    header h1 { font-size: clamp(1.1rem, 2.5dvh, 1.35rem); font-weight: 800; color: #fff; }
    header span { color: var(--red); }
    .badge { display: inline-block; margin-top: 0.02rem; background: var(--card); border: 1px solid #334155; color: var(--sub); font-size: 0.65rem; font-weight: 700; padding: 0.06rem 0.45rem; border-radius: 99px; }
    .badge strong { color: var(--green); }

    .search-wrap { position: relative; width: 100%; max-width: 340px; flex-shrink: 0; z-index: 20; }
    .search-box { display: flex; gap: 0.35rem; width: 100%; }
    .search-box input { flex: 1; background: var(--card); border: 1px solid #334155; color: #fff; padding: clamp(0.3rem, 0.7dvh, 0.42rem) 0.85rem; border-radius: 99px; font-size: 0.76rem; outline: none; }
    .search-box input:focus { border-color: var(--red); }
    .search-box button { background: #334155; color: #fff; border: none; padding: 0 0.95rem; border-radius: 99px; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .suggestions { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--card); border: 1px solid #334155; border-radius: 14px; max-height: 180px; overflow-y: auto; list-style: none; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .suggestions li { padding: 0.55rem 0.85rem; display: flex; justify-content: space-between; font-size: 0.82rem; border-bottom: 1px solid #2d3748; cursor: pointer; text-transform: capitalize; }
    .suggestions li:last-child { border-bottom: none; }

    .wheel-wrap { 
      position: relative; 
      width: clamp(210px, 32dvh, 255px); 
      height: clamp(210px, 32dvh, 255px); 
      margin: clamp(0.3rem, 1dvh, 0.6rem) auto; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      flex-shrink: 0; 
      transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  height 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  margin 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
    }
    body.has-active .wheel-wrap { 
      width: clamp(55px, 7dvh, 75px); 
      height: clamp(55px, 7dvh, 75px); 
      margin: 0 auto clamp(0.01rem, 0.1dvh, 0.05rem) auto; 
    }
    
    .wheel { 
      position: relative; 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      border: clamp(3px, 0.6dvh, 5px) solid var(--card); 
      background: conic-gradient(
        #EAE5CE 0 20deg, #EE3F1E 20deg 40deg, #1C95F0 40deg 60deg, #22C02A 60deg 80deg,
        #F5D61A 80deg 100deg, #70D6F5 100deg 120deg, #E65A15 120deg 140deg, #A944B8 140deg 160deg,
        #CCA03B 160deg 180deg, #8E6BE8 180deg 200deg, #EA3E7B 200deg 220deg, #91C01E 220deg 240deg,
        #B59030 240deg 260deg, #6B45B5 260deg 280deg, #E5BE00 280deg 300deg, #233544 300deg 320deg,
        #9AA2AC 320deg 340deg, #F469A9 340deg 360deg
      ); 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
    }
    .wheel-icons { position: absolute; inset: 0; pointer-events: none; }
    .slice-icon { position: absolute; width: 11.5%; height: 11.5%; display: flex; align-items: center; justify-content: center; opacity: 0.9; }
    .slice-icon svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45)); }
    .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 17px solid #fff; z-index: 10; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.6)); transition: all 0.35s; }
    body.has-active .pointer { top: -6px; border-left-width: 5px; border-right-width: 5px; border-top-width: 9px; }
    .center-hub { position: absolute; width: clamp(32px, 5.2dvh, 44px); height: clamp(32px, 5.2dvh, 44px); background: #fff; border-radius: 50%; border: 3px solid var(--bg); z-index: 5; display: flex; align-items: center; justify-content: center; transition: all 0.35s; }
    body.has-active .center-hub { width: clamp(14px, 1.8dvh, 18px); height: clamp(14px, 1.8dvh, 18px); border-width: 2px; }
    .center-hub::after { content: ''; width: 40%; height: 40%; border-radius: 50%; background: var(--red); border: 2px solid var(--bg); }

    .spin-row { display: flex; gap: 0; width: 100%; justify-content: center; align-items: center; flex-shrink: 0; }
    body.has-active .spin-row { gap: 0.4rem; }

    .btn-spin { 
      background: linear-gradient(135deg, var(--red), #dc2626); 
      color: #fff; 
      border: none; 
      padding: clamp(0.55rem, 1.4dvh, 0.75rem) clamp(1.8rem, 5vw, 2.4rem); 
      font-size: clamp(0.88rem, 2dvh, 1.05rem); 
      font-weight: 800; 
      letter-spacing: 0.5px; 
      border-radius: 99px; 
      box-shadow: 0 6px 20px rgba(239,68,68,0.45); 
      cursor: pointer; 
      white-space: nowrap;
      transition: padding 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.2s;
    }
    .btn-spin:active { transform: scale(0.96); }
    .btn-spin:disabled { opacity: 0.55; cursor: not-allowed; }
    
    body.has-active .btn-spin { padding: clamp(0.32rem, 0.75dvh, 0.45rem) clamp(0.85rem, 2.5vw, 1.2rem); font-size: 0.8rem; }

    .btn-close { 
      background: linear-gradient(135deg, var(--red), #dc2626); 
      color: #fff; 
      border: none; 
      width: clamp(26px, 3.2dvh, 32px); 
      height: clamp(26px, 3.2dvh, 32px); 
      border-radius: 50%; 
      display: none; 
      align-items: center; 
      justify-content: center; 
      font-size: 0.95rem; 
      font-weight: 900; 
      box-shadow: 0 6px 20px rgba(239,68,68,0.45); 
      cursor: pointer; 
      flex-shrink: 0;
      animation: springPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-close:active { transform: scale(0.92); }
    body.has-active .btn-close { display: flex; }
    @keyframes springPop { 0% { opacity: 0; transform: scale(0.3) rotate(-90deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }

    .hub { display: flex; justify-content: center; gap: 0.65rem; margin: 0.01rem 0; flex-shrink: 0; }
    .btn-hub { position: relative; background: var(--card); border: 1px solid #334155; width: clamp(26px, 3.2dvh, 30px); height: clamp(26px, 3.2dvh, 30px); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-hub svg { width: 13px; height: 13px; fill: none; stroke: #f8fafc; stroke-width: 2; }
    .hub-badge { position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff; font-size: 0.52rem; font-weight: 800; width: 13px; height: 13px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }

    /* Enlarged Active Card View Container */
    .card { 
      width: 100%; 
      background: var(--card); 
      border-radius: 18px; 
      padding: clamp(0.3rem, 0.8dvh, 0.55rem) clamp(0.6rem, 2vw, 0.9rem); 
      border: 2px solid #334155; 
      box-shadow: 0 14px 32px rgba(0,0,0,0.45); 
      display: none; 
      text-align: center; 
      user-select: none; 
      flex-shrink: 1; 
      min-height: 0; 
      position: relative; 
      animation: custodySlideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
      overflow-y: auto;
      max-height: calc(100dvh - 120px);
    }
    @keyframes custodySlideUp {
      from { opacity: 0; transform: translateY(35px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.02rem; }
    .card-nav button { background: none; border: none; color: var(--sub); font-size: 1.25rem; font-weight: 900; padding: 0 0.5rem; cursor: pointer; }
    
    /* Enlarged Pokémon Artwork Display */
    .img-box { 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin: 0 auto;
      width: clamp(115px, 16dvh, 155px); 
      height: clamp(115px, 16dvh, 155px); 
      aspect-ratio: 1 / 1;
    }
    .card img.main-art { 
      width: 100%; 
      height: 100%; 
      max-width: 100%; 
      max-height: 100%; 
      object-fit: contain; 
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)); 
      pointer-events: none; 
    }

    .sparkle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 2.6rem; color: var(--gold); pointer-events: none; z-index: 10; }
    .sparkle.pop { animation: pop 0.8s ease-out forwards; }
    @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.6) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 12px #f59e0b); } 100% { transform: translate(-50%, -50%) scale(2.2) rotate(360deg); opacity: 0; } }
    .tick-badge { position: absolute; top: 2px; right: 2px; background: var(--green); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 900; border: 2px solid #fff; opacity: 0; transform: scale(0.5); transition: all 0.25s; }
    .tick-badge.active { opacity: 1; transform: scale(1); }
    .poke-name { font-size: clamp(1.05rem, 2.1dvh, 1.3rem); font-weight: 800; text-transform: capitalize; margin: 0.02rem 0; }
    
    .card-actions { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: clamp(0.1rem, 0.3dvh, 0.22rem); padding: 0 0.4rem; }
    .btn-icon { background: none; border: none; font-size: 1.15rem; cursor: pointer; color: var(--sub); }
    .btn-icon.active { color: var(--gold); filter: drop-shadow(0 0 6px rgba(245,158,11,0.7)); }
    .types { display: flex; gap: 0.4rem; }
    .pill { font-size: 0.6rem; font-weight: 800; padding: 0.08rem 0.5rem; border-radius: 99px; text-transform: uppercase; color: #fff; }

    .lore-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: clamp(0.25rem, 0.55dvh, 0.4rem) 0.65rem;
      margin-bottom: clamp(0.12rem, 0.3dvh, 0.22rem);
      font-size: clamp(0.65rem, 1.2dvh, 0.74rem);
      color: #cbd5e1;
      line-height: 1.35;
      text-align: center;
      width: 100%;
      height: auto;
      overflow: visible;
      word-wrap: break-word;
      white-space: normal;
    }

    .evo-chain-wrap {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      margin-bottom: clamp(0.12rem, 0.3dvh, 0.22rem);
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 0.1rem 0.4rem;
    }
    .evo-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 0.05rem 0.2rem;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .evo-node:active { background: #334155; }
    .evo-node.active-evo { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--red); }
    .evo-node img { width: clamp(22px, 2.9dvh, 27px); height: clamp(22px, 2.9dvh, 27px); object-fit: contain; }
    .evo-node span { font-size: 0.55rem; font-weight: 700; text-transform: capitalize; color: var(--sub); max-width: 55px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .evo-node.active-evo span { color: #fff; }
    .evo-arrow { color: var(--sub); font-size: 0.65rem; font-weight: 900; }

    .tcg-section-wrap {
      width: 100%;
      margin-bottom: clamp(0.12rem, 0.3dvh, 0.22rem);
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 0.35rem 0.5rem;
      text-align: left;
    }
    
    .tcg-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
      gap: 0.4rem;
    }
    
    .tcg-segmented-control {
      display: inline-flex;
      background: #0b1120;
      padding: 2px;
      border-radius: 99px;
      border: 1px solid #334155;
    }
    .tcg-seg-btn {
      background: none;
      border: none;
      color: var(--sub);
      font-size: 0.6rem;
      font-weight: 800;
      padding: 0.18rem 0.6rem;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }
    .tcg-seg-btn.active {
      background: #334155;
      color: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .tcg-seg-btn.active.fullart-active {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(245, 158, 11, 0.1));
      color: var(--gold);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    
    .tcg-count-text {
      color: var(--gold);
      font-size: 0.62rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .tcg-scroll-strip {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 0.25rem;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      min-height: 94px;
      align-items: center;
    }
    .tcg-card-item {
      flex: 0 0 clamp(62px, 8.5dvh, 74px);
      width: clamp(62px, 8.5dvh, 74px);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .tcg-card-item:active { transform: scale(0.94); }
    
    /* Enlarged TCG Card Thumbnails */
    .tcg-thumb-frame {
      width: clamp(62px, 8.5dvh, 74px);
      height: calc(clamp(62px, 8.5dvh, 74px) * (88 / 63));
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0,0,0,0.65);
      border: 1px solid #334155;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tcg-card-thumb {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
    .tcg-card-set {
      font-size: 0.54rem;
      font-weight: 700;
      color: #fff;
      margin-top: 0.18rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
    }
    .tcg-card-num { font-size: 0.48rem; color: var(--sub); font-weight: 700; }
    
    .tcg-skeleton-card {
      flex: 0 0 clamp(62px, 8.5dvh, 74px);
      width: clamp(62px, 8.5dvh, 74px);
      height: calc(clamp(62px, 8.5dvh, 74px) * (88 / 63));
      border-radius: 5px;
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
      animation: skeletonShimmer 1.2s infinite ease-in-out;
      border: 1px solid #334155;
    }
    @keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .btn-collect { width: 100%; padding: clamp(0.2rem, 0.5dvh, 0.32rem); margin-bottom: clamp(0.1rem, 0.25dvh, 0.18rem); border-radius: 8px; border: 1px solid #334155; background: var(--bg); color: var(--sub); font-size: 0.7rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.35rem; }
    .btn-collect.active { background: rgba(16,185,129,0.15); border-color: var(--green); color: var(--green); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.04rem 0.7rem; text-align: left; background: var(--bg); padding: clamp(0.18rem, 0.4dvh, 0.28rem) 0.65rem; border-radius: 8px; font-size: clamp(0.6rem, 1.1dvh, 0.68rem); }
    .stats span:last-child { font-weight: 700; float: right; }

    .tcg-zoom-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .tcg-zoom-content {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 1rem;
      max-width: 320px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      animation: zoomIn 0.2s ease-out;
    }
    @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .tcg-zoom-img {
      width: 220px;
      aspect-ratio: 63 / 88;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .tcg-zoom-title { font-size: 0.95rem; font-weight: 800; text-align: center; }
    .tcg-zoom-meta { font-size: 0.72rem; color: var(--sub); font-weight: 700; text-align: center; }
    .tcg-zoom-close { background: var(--red); color: white; border: none; padding: 0.4rem 1.2rem; border-radius: 99px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }

    .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(6px); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
    .modal-body { background: var(--card); width: 100vw; max-width: 500px; max-height: 85vh; border-radius: 28px 28px 0 0; border: 1px solid #334155; border-bottom: none; display: flex; flex-direction: column; padding: 1.1rem 0.75rem 1rem 0.75rem; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #334155; }
    
    .dex-search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid #334155;
      color: #fff;
      padding: 0.45rem 0.85rem;
      border-radius: 99px;
      font-size: 0.78rem;
      outline: none;
      margin-bottom: 0.5rem;
    }
    .dex-search-input:focus { border-color: var(--red); }
    
    .tabs { display: flex; gap: 0.35rem; margin-bottom: 0.55rem; }
    .tabs button { flex: 1; background: var(--bg); border: 1px solid #334155; color: var(--sub); font-size: 0.74rem; font-weight: 700; padding: 0.45rem 0; border-radius: 8px; cursor: pointer; }
    .tabs button.active { background: var(--red); border-color: var(--red); color: #fff; }
    .list-view { list-style: none; overflow-y: auto; flex: 1; width: 100%; padding-bottom: 0.8rem; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.35rem; }
    .dex-item { background: var(--bg); border: 1px solid #334155; border-radius: 10px; padding: 0.4rem 0.15rem; text-align: center; cursor: pointer; position: relative; }
    .dex-item.owned { border-color: rgba(16,185,129,0.45); background: rgba(16,185,129,0.08); }
    .dex-item img { width: 100%; max-width: 48px; aspect-ratio: 1; object-fit: contain; }
    .dex-item.unowned img { filter: grayscale(1) opacity(0.28); }
    .recent-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem; border-radius: 12px; cursor: pointer; }
    .recent-item img { width: 44px; height: 44px; object-fit: contain; }
  </style>
</head>
<body>

  <div class="viewport">
    <header>
      <h1>Poké<span>Roulette</span></h1>
      <div class="badge">Collected: <strong id="tCount">0</strong> / 1025</div>
    </header>

    <div class="search-wrap">
      <form class="search-box" onsubmit="event.preventDefault(); submitSearch();">
        <input type="text" id="sInput" placeholder="Type Pokémon Name or Dex #" autocomplete="off" oninput="handleSearch(this.value)" />
        <button type="submit">Search</button>
      </form>
      <ul class="suggestions" id="sList"></ul>
    </div>

    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>
      <div class="center-hub"></div>
    </div>

    <div class="spin-row">

    const TYPES = ['normal','fire','water','grass','electric','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];
    const COLORS = { normal:'#A8A77A', fire:'#EE3F1E', water:'#1C95F0', grass:'#22C02A', electric:'#F5D61A', ice:'#70D6F5', fighting:'#E65A15', poison:'#A944B8', ground:'#CCA03B', flying:'#8E6BE8', psychic:'#EA3E7B', bug:'#91C01E', rock:'#B59030', ghost:'#6B45B5', dragon:'#E5BE00', dark:'#233544', steel:'#9AA2AC', fairy:'#F469A9' };
    
    const SVGS = {

      water: '<svg viewBox="0 0 24 24"><path fill="#083863" d="M12 2.5C12 2.5 5.5 10.5 5.5 15a6.5 6.5 0 0 0 13 0c0-4.5-6.5-12.5-6.5-12.5zm-2.2 16a2.2 2.2 0 0 1-2.2-2.2c0-1.2 1-2.2 2.2-2.2s2.2 1 2.2 2.2-1 2.2-2.2 2.2z"/></svg>',

      bug: '<svg viewBox="0 0 24 24"><path fill="#3a4a06" d="M12 4c-3.5 0-6.5 2.5-6.5 6 0 2.2 1.2 4.2 3 5.2V19a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-3.8c1.8-1 3-3 3-5.2 0-3.5-3-6-6.5-6zm-2.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>',
      rock: '<svg viewBox="0 0 24 24"><path fill="#463608" d="M7 5l6-2 5 4-1 6-7 7-5-3 2-12zm4 3l-2 5 4 3 3-4-1-3-4-1z"/></svg>',
      ghost: '<svg viewBox="0 0 24 24"><path fill="#2c1556" d="M12 3c-4.5 0-8 3.5-8 8v8l3-2 2.5 2 2.5-2 2.5 2 2.5-2 3 2v-8c0-4.5-3.5-8-8-8zm-3 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm6 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>',
      dragon: '<svg viewBox="0 0 24 24"><path fill="#544300" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.5 0 3-.3 4.2-1-3-1-5-3.5-5-7 0-3.5 2.5-6.5 6-7.5-1.5-1.2-3.2-2.5-5.2-2.5z"/></svg>',
      dark: '<svg viewBox="0 0 24 24"><path fill="#0d1924" d="M12 3a9 9 0 1 0 9 9c0-.6 0-1.2-.2-1.8A7 7 0 0 1 12 3z"/></svg>',
      steel: '<svg viewBox="0 0 24 24"><path fill="#363c44" d="M12 2L4 7v10l8 5 8-5V7l-8-5zm0 3.5l5 3.2v6.6l-5 3.2-5-3.2V8.7l5-3.2z"/></svg>',

    };

    const KNOWN_SETS = {
      'sv03.5': '151', 'sv06': 'Twilight Masquerade', 'sv04': 'Paradox Rift', 'sv01': 'Scarlet & Violet',
      'sv02': 'Paldea Evolved', 'sv03': 'Obsidian Flames', 'sv05': 'Temporal Forces', 'sv07': 'Stellar Crown',

      'swsh12pt5': 'Crown Zenith', 'swsh12': 'Silver Tempest', 'swsh11': 'Lost Origin', 'swsh10': 'Astral Radiance',
      'swsh09': 'Brilliant Stars', 'swsh08': 'Fusion Strike', 'swsh07': 'Evolving Skies', 'swsh06': 'Chilling Reign',
      'swsh05': 'Battle Styles', 'swsh045': 'Shining Fates', 'swsh04': 'Vivid Voltage', 'swsh035': 'Champion\'s Path',
      'swsh03': 'Darkness Ablaze', 'swsh02': 'Rebel Clash', 'swsh01': 'Sword & Shield', 'cel25': 'Celebrations',
      'sm12': 'Cosmic Eclipse', 'sm115': 'Hidden Fates', 'sm11': 'Unified Minds', 'sm10': 'Unbroken Bonds',
      'sm09': 'Team Up', 'sm08': 'Lost Thunder', 'sm075': 'Dragon Majesty', 'sm07': 'Celestial Storm',
      'sm06': 'Forbidden Light', 'sm05': 'Ultra Prism', 'sm04': 'Crimson Invasion', 'sm035': 'Shining Legends',
      'sm03': 'Burning Shadows', 'sm02': 'Guardians Rising', 'sm01': 'Sun & Moon',
      'xy12': 'Evolutions', 'xy11': 'Steam Siege', 'xy10': 'Fates Collide', 'xy09': 'BREAKpoint',
      'xy08': 'BREAKthrough', 'xy07': 'Ancient Origins', 'xy06': 'Roaring Skies', 'xy05': 'Primal Clash',
      'xy04': 'Phantom Forces', 'xy03': 'Furious Fists', 'xy02': 'Flashfire', 'xy01': 'XY Base',
      'bw11': 'Legendary Treasures', 'bw10': 'Plasma Blast', 'bw09': 'Plasma Freeze', 'bw08': 'Plasma Storm',
      'bw07': 'Boundaries Crossed', 'bw06': 'Dragons Exalted', 'bw05': 'Dark Explorers', 'bw04': 'Next Destinies',
      'bw03': 'Noble Victories', 'bw02': 'Emerging Powers', 'bw01': 'Black & White',
      'col1': 'Call of Legends', 'hgss04': 'Triumphant', 'hgss03': 'Undaunted', 'hgss02': 'Unleashed', 'hgss01': 'HeartGold & SoulSilver',
      'pl4': 'Arceus', 'pl3': 'Supreme Victors', 'pl2': 'Rising Rivals', 'pl1': 'Platinum',
      'dp07': 'Stormfront', 'dp06': 'Legends Awakened', 'dp05': 'Majestic Dawn', 'dp04': 'Great Encounters',
      'dp03': 'Secret Wonders', 'dp02': 'Mysterious Treasures', 'dp01': 'Diamond & Pearl',
      'ex16': 'Power Keepers', 'ex15': 'Dragon Frontiers', 'ex14': 'Crystal Guardians', 'ex13': 'Holon Phantoms',
      'ex12': 'Legend Maker', 'ex11': 'Delta Species', 'ex10': 'Unseen Forces', 'ex09': 'Emerald',
      'ex08': 'Deoxys', 'ex07': 'Team Rocket Returns', 'ex06': 'FireRed & LeafGreen', 'ex05': 'Hidden Legends',
      'ex04': 'Team Magma vs Aqua', 'ex03': 'Dragon', 'ex02': 'Sandstorm', 'ex01': 'Ruby & Sapphire',
      'base1': 'Base Set', 'base2': 'Jungle', 'base3': 'Fossil', 'base4': 'Base Set 2', 'base5': 'Team Rocket',
      'gym1': 'Gym Heroes', 'gym2': 'Gym Challenge', 'neo1': 'Neo Genesis', 'neo2': 'Neo Discovery',
      'neo3': 'Neo Revelation', 'neo4': 'Neo Destiny', 'si1': 'Southern Islands', 'base6': 'Legendary Collection',
      'smp': 'SM Promos', 'swshp': 'SWSH Promos', 'svp': 'SV Promos', 'xyp': 'XY Promos',
      'bwp': 'BW Promos', 'dpp': 'DP Promos', 'np': 'Nintendo Promos', 'pop': 'POP Series'
    };

    let dir = [], rot = 0, audioCtx = null, curPoke = null, isShiny = false, curId = null, tabFilter = 'all', dexQuery = '', activeTcgRequestId = 0, isSpinning = false;
    let currentTcgMode = 'fullArts';
    let currentTcgDataSet = { fullArts: [], otherVariants: [] };
    const memoryTcgCache = new Map();

    function getCleanNationalDexName(pokeName, speciesName) {
      if (speciesName) return speciesName.replace(/-/g, ' ');
      if (!pokeName) return '';
      
      const parts = pokeName.split('-');
      const suffixes = new Set(['male', 'female', 'average', 'small', 'large', 'super', 'red', 'blue', 'yellow', 'white', 'standard', 'incarnate', 'ordinary', 'aria', 'midday', 'midnight', 'dusk', 'solo', 'shield', 'disguised', 'plant', 'sandy', 'trash', 'overcast', 'sunshine', 'east', 'west']);
      if (parts.length > 1 && suffixes.has(parts[parts.length - 1].toLowerCase())) {
        return parts.slice(0, parts.length - 1).join(' ');
      }
      return pokeName.replace(/-/g, ' ');
    }

    function resolveSetName(setObj) {
      if (!setObj) return 'Promo';
      if (typeof setObj === 'string') {
        const clean = setObj.trim();
        if (clean && clean !== 'Set' && clean !== 'TCG Set') return clean;
        return 'Promo';
      }
      if (setObj.id) {
        const lowerId = setObj.id.toLowerCase();
        if (KNOWN_SETS[lowerId]) return KNOWN_SETS[lowerId];
      }
      if (setObj.name && setObj.name !== 'Set' && setObj.name !== 'TCG Set') return setObj.name;
      if (setObj.series) return setObj.series;
      return 'Promo';
    }

    function buildIcons() {
      const wheel = document.getElementById('wheel');
      const layer = document.createElement('div');
      layer.className = 'wheel-icons';
      TYPES.forEach((t, i) => {
        const deg = i * 20 + 10, rad = (deg - 90) * (Math.PI / 180);
        const el = document.createElement('div');
        el.className = 'slice-icon';
        el.style.left = `${(50 + 37 * Math.cos(rad)).toFixed(2)}%`;
        el.style.top = `${(50 + 37 * Math.sin(rad)).toFixed(2)}%`;
        el.style.transform = `translate(-50%, -50%) rotate(${deg}deg)`;
        el.innerHTML = SVGS[t] || '';
        layer.appendChild(el);
      });
      wheel.appendChild(layer);
    }

    const getCol = () => new Set(JSON.parse(localStorage.getItem('p_col') || '[]'));
    const saveCol = s => { localStorage.setItem('p_col', JSON.stringify([...s])); updateCounts(); renderRecents(); if (curId) updateBtn(s.has(curId)); };
    const getRec = () => JSON.parse(localStorage.getItem('p_rec') || '[]');
    
    function addRec(p) {
      let r = getRec().filter(x => x.id !== p.id);
      const cleanName = getCleanNationalDexName(p.name, p.species?.name);
      r.unshift({ id: p.id, name: cleanName, type: p.types[0].type.name, sprite: p.sprites.other?.home?.front_default || p.sprites.other?.['official-artwork']?.front_default || p.sprites.front_default });
      localStorage.setItem('p_rec', JSON.stringify(r.slice(0, 20)));
      updateCounts();
    }

    function clearHistory() { localStorage.removeItem('p_rec'); updateCounts(); renderRecents(); }

    function updateCounts() {
      const s = getCol(), r = getRec();
      document.getElementById('tCount').innerText = s.size;
      document.getElementById('tOwned').innerText = s.size;
      document.getElementById('tMissing').innerText = TOTAL - s.size;
      document.getElementById('bagBadge').innerText = r.length;
    }

    function openModal(id) {
      if (id === 'dexModal') {
        dexQuery = '';
        const input = document.getElementById('dexFilterInput');
        if (input) input.value = '';
        renderDex();
      }
      if (id === 'recentModal') renderRecents();
      document.getElementById(id).style.display = 'flex';
    }
    function closeModal(e, id) { if (!e || e.target.id === id) document.getElementById(id).style.display = 'none'; }

    function setDexTab(t) {
      tabFilter = t;
      ['all', 'owned', 'missing'].forEach(x => document.getElementById(`tab-${x}`).classList.toggle('active', x === t));
      renderDex();
    }

    function handleDexFilterSearch(val) {
      dexQuery = val.trim().toLowerCase().replace('#', '');
      renderDex();
    }

    function renderDex() {
      const g = document.getElementById('dexGrid'), s = getCol();
      let list = dir;
      if (tabFilter === 'owned') list = dir.filter(p => s.has(p.id));
      if (tabFilter === 'missing') list = dir.filter(p => !s.has(p.id));
      
      if (dexQuery) {
        const isN = !isNaN(parseInt(dexQuery));
        list = list.filter(p => isN ? (p.id === parseInt(dexQuery) || String(p.id).startsWith(dexQuery)) : p.name.toLowerCase().includes(dexQuery));
      }

      g.innerHTML = list.length ? '' : '<div style="grid-column:span 4;color:var(--sub);text-align:center;padding:2rem 0;">No Pokémon found!</div>';
      list.forEach(p => {
        const owned = s.has(p.id), d = document.createElement('div');
        d.className = `dex-item ${owned ? 'owned' : 'unowned'}`;
        d.innerHTML = `${owned ? '<div style="position:absolute;top:3px;right:3px;background:var(--green);color:#fff;font-size:0.52rem;font-weight:900;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;">✓</div>' : ''}<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" loading="lazy"/><div style="font-size:0.62rem;font-weight:800;color:var(--sub)">#${String(p.id).padStart(4,'0')}</div><div style="font-size:0.65rem;font-weight:700;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name.replace('-',' ')}</div>`;
        d.onclick = () => {
          initAudio();
          s.has(p.id) ? s.delete(p.id) : (s.add(p.id), playTick());
          saveCol(s);
          renderDex();
        };
        g.appendChild(d);
      });
    }

    function renderRecents() {
      const l = document.getElementById('recentsList'), r = getRec(), s = getCol();
      l.innerHTML = r.length ? '' : '<div style="color:var(--sub);text-align:center;padding:2rem 0;">No History!</div>';
      r.forEach(p => {
        const li = document.createElement('li');
        li.className = 'recent-item';
        li.innerHTML = `<img src="${p.sprite}"/><div style="flex:1;"><div style="font-weight:800;font-size:0.95rem;text-transform:capitalize;">${p.name}</div><div style="font-size:0.75rem;color:var(--sub);font-weight:700;">#${String(p.id).padStart(4,'0')} · <span style="color:${COLORS[p.type]||'#fff'}">${p.type.toUpperCase()}</span></div></div>${s.has(p.id)?'<span style="color:var(--green);font-weight:900;">✓</span>':''}`;
        li.onclick = () => { closeModal(null, 'recentModal'); loadPoke(p.id, 0, false); };
        l.appendChild(li);
      });
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTick() {
      if (navigator.vibrate) navigator.vibrate(12);
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(340, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.04);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.04);
    }

    function playCry() {
      if (!curPoke?.cries) return;
      const url = curPoke.cries.latest || curPoke.cries.legacy;
      if (url) { const a = new Audio(url); a.volume = 0.65; a.play().catch(() => {}); }
    }

      if (p.sprites.other?.home?.front_default) {

    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
    }

    function updateCardAura(types) {
      const card = document.getElementById('pokeCard');
      const primaryHex = COLORS[types[0]?.type?.name] || '#ef4444';
      const secondaryHex = types[1] ? (COLORS[types[1].type.name] || primaryHex) : primaryHex;
      
      const pRgb = hexToRgb(primaryHex);
      const sRgb = hexToRgb(secondaryHex);

      card.style.borderColor = primaryHex;
      card.style.boxShadow = `0 14px 32px rgba(0,0,0,0.55), 0 0 24px rgba(${pRgb}, 0.45), inset 0 0 16px rgba(${sRgb}, 0.25)`;
    }

    async function fetchLoreAndEvolution(speciesUrl, fallbackId) {
      const loreBox = document.getElementById('pokeLore');
      const evoBox = document.getElementById('evoChain');
      if (!isSpinning) {
        loreBox.innerText = "Accessing Pokédex lore...";
        evoBox.style.display = 'none';
        evoBox.innerHTML = '';
      }

      try {
        const url = speciesUrl || `https://pokeapi.co/api/v2/pokemon-species/${fallbackId}/`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Species error");
        const data = await res.json();
        
        if (isSpinning) return;

        const cleanSpeciesName = (data.names && data.names.find(n => n.language.name === 'en')?.name) || data.name.replace(/-/g, ' ');
        document.getElementById('pokeName').innerText = cleanSpeciesName;

        const enEntry = data.flavor_text_entries ? data.flavor_text_entries.find(e => e.language.name === 'en') : null;
        loreBox.innerText = enEntry ? enEntry.flavor_text.replace(/[\n\f\r]/g, ' ').replace(/\s+/g, ' ').trim() : "No Pokédex lore entry recorded.";

        if (data.evolution_chain?.url) {
          const evoRes = await fetch(data.evolution_chain.url);
          const evoData = await evoRes.json();
          renderEvolutionChain(evoData.chain);
        }
      } catch (err) {

    function renderEvolutionChain(chain) {
      const evoBox = document.getElementById('evoChain');
      evoBox.innerHTML = '';
      const stages = [];

      let curr = chain;
      while (curr) {
        const id = parseInt(curr.species.url.split('/').filter(Boolean).pop());
        stages.push({ id: id, name: curr.species.name });
        curr = curr.evolves_to && curr.evolves_to.length ? curr.evolves_to[0] : null;
      }

      if (stages.length <= 1) {
        evoBox.style.display = 'none';
        return;
      }

      stages.forEach((st, idx) => {
        if (idx > 0) {
          const arrow = document.createElement('span');
          arrow.className = 'evo-arrow';
          arrow.innerText = '›';
          evoBox.appendChild(arrow);
        }

        const node = document.createElement('div');
        node.className = `evo-node ${st.id === curId ? 'active-evo' : ''}`;
        node.innerHTML = `
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${st.id}.png" alt="${st.name}" />
          <span>${st.name.replace('-', ' ')}</span>
        `;
        node.onclick = () => {
          if (st.id !== curId) loadPoke(st.id, 0, false);
        };
        evoBox.appendChild(node);
      });

      evoBox.style.display = 'flex';
    }

    // Exact Classification & Priority Ranks (1 to 28)
    function evaluateCardTier(card) {
      const r = (card.rarity || '').toLowerCase().trim();
      const subtypes = (card.subtypes || []).map(s => s.toLowerCase().trim());
      const number = String(card.number || '').toLowerCase().trim();
      const setTotal = card.set?.printedTotal || card.set?.total || 0;
      const name = (card.name || '').toLowerCase().trim();

      const numVal = parseInt(number.replace(/\D/g, ''));
      const isSecretMath = (setTotal > 0 && numVal > setTotal && !r.includes('common') && !r.includes('uncommon'));
      const isFullArtSubtype = subtypes.includes('full art') || r.includes('full art');
      const isSubset = number.startsWith('tg') || number.startsWith('gg') || number.startsWith('sv') || number.startsWith('rc') || number.startsWith('svp');

      // --- FULL ARTS GROUP (Rank 1 to 13) ---
      // 1. Mega Attack Rare
      if (r.includes('mega attack')) return { category: 'fullArts', rank: 1 };
      // 2. Mega Hyper Rare
      if (r.includes('mega hyper')) return { category: 'fullArts', rank: 2 };
      // 3. Black White Rare
      if (r.includes('black white') || r.includes('black & white rare')) return { category: 'fullArts', rank: 3 };
      // 4. Hyper Rare
      if (r.includes('hyper rare') || r.includes('rainbow') || r.includes('crown') || r.includes('gold')) return { category: 'fullArts', rank: 4 };
      // 5. Shiny Ultra Rare
      if (r.includes('shiny ultra rare') || r.includes('shiny super rare')) return { category: 'fullArts', rank: 5 };
      // 6. Special Illustration Rare
      if (r.includes('special illustration') || subtypes.includes('special illustration rare')) return { category: 'fullArts', rank: 6 };
      // 7. Illustration Rare
      if (r.includes('illustration rare') || subtypes.includes('illustration rare') || (isSecretMath && r.includes('rare') && !r.includes('holo')) || isSubset) return { category: 'fullArts', rank: 7 };
      // 8. Promo (full card artwork covering the whole card)
      if (r.includes('promo') && (isFullArtSubtype || isSubset || isSecretMath || number.startsWith('svp'))) return { category: 'fullArts', rank: 8 };
      // 9. Rare Break
      if (r.includes('break') || subtypes.includes('break')) return { category: 'fullArts', rank: 9 };
      // 10. Ultra Rare (full card artwork covering the whole card)
      if ((r.includes('ultra rare') || r.includes('rare ultra')) && (isFullArtSubtype || isSecretMath || isSubset || numVal > setTotal)) return { category: 'fullArts', rank: 10 };
      // 11. Rare Holo GX
      if (r.includes('rare holo gx') || r.includes('gx') || name.includes(' gx')) return { category: 'fullArts', rank: 11 };
      // 12. Rare Holo EX (full card artwork covering the whole card) / Megas
      if ((r.includes('rare holo ex') || r.includes('ex') || name.includes(' ex') || subtypes.includes('mega') || name.startsWith('m ')) && (isFullArtSubtype || isSecretMath || subtypes.includes('mega'))) return { category: 'fullArts', rank: 12 };
      // 13. Holo Rare V / VMAX / VSTAR
      if (r.includes('rare holo v') || r.includes('holo rare v') || subtypes.includes('v') || subtypes.includes('vmax') || subtypes.includes('vstar') || name.includes(' v') || name.includes(' vmax') || name.includes(' vstar')) return { category: 'fullArts', rank: 13 };

      // --- OTHER VARIANTS GROUP (Rank 14 to 28) ---
      // 14. Shiny Rare
      if (r.includes('shiny rare') || r.includes('shining')) return { category: 'otherVariants', rank: 14 };
      // 15. Radiant Rare
      if (r.includes('radiant') || subtypes.includes('radiant')) return { category: 'otherVariants', rank: 15 };
      // 16. Amazing
      if (r.includes('amazing') || subtypes.includes('amazing')) return { category: 'otherVariants', rank: 16 };
      // 17. Promo (does not have full card artwork)
      if (r.includes('promo')) return { category: 'otherVariants', rank: 17 };
      // 18. ACE SPEC Rare
      if (r.includes('ace spec') || subtypes.includes('ace spec')) return { category: 'otherVariants', rank: 18 };
      // 19. Double Rare
      if (r.includes('double rare')) return { category: 'otherVariants', rank: 19 };
      // 20. Ultra Rare (does not have full card artwork)
      if (r.includes('ultra rare') || r.includes('rare ultra')) return { category: 'otherVariants', rank: 20 };
      // 21. LEGEND
      if (r.includes('legend') || subtypes.includes('legend')) return { category: 'otherVariants', rank: 21 };
      // 22. Rare Prime
      if (r.includes('prime') || subtypes.includes('prime')) return { category: 'otherVariants', rank: 22 };
      // 23. Rare Holo Lv.X
      if (r.includes('lv.x') || subtypes.includes('lv.x') || name.includes(' lv.x')) return { category: 'otherVariants', rank: 23 };
      // 24. Rare Holo EX (does not have full card artwork)
      if (r.includes('rare holo ex') || r.includes('ex') || name.includes(' ex')) return { category: 'otherVariants', rank: 24 };
      // 25. Rare Holo
      if (r.includes('rare holo') || r.includes('holo')) return { category: 'otherVariants', rank: 25 };
      // 26. Rare
      if (r.includes('rare')) return { category: 'otherVariants', rank: 26 };
      // 27. Uncommon
      if (r.includes('uncommon')) return { category: 'otherVariants', rank: 27 };
      // 28. Common
      if (r.includes('common')) return { category: 'otherVariants', rank: 28 };

      return { category: 'otherVariants', rank: 29 };
    }

    function setTcgViewMode(mode) {

    function updateTcgToggleUI() {
      const btnFull = document.getElementById('segFullArts');
      const btnOther = document.getElementById('segOtherVariants');
      if (currentTcgMode === 'fullArts') {
        btnFull.className = 'tcg-seg-btn active fullart-active';

        btnFull.className = 'tcg-seg-btn';

    function renderActiveTcgDisplay() {
      let displayCards = [];
      let isShowingOther = false;

      // Smart Toggle Fallback: If 0 full arts exist, auto-switch to Other Variants and update toggle
      if (currentTcgDataSet.fullArts.length === 0 && currentTcgDataSet.otherVariants.length > 0) {
        currentTcgMode = 'otherVariants';
        updateTcgToggleUI();
      }

      if (currentTcgMode === 'otherVariants') {
        displayCards = currentTcgDataSet.otherVariants.length ? currentTcgDataSet.otherVariants : currentTcgDataSet.fullArts;
        isShowingOther = true;
      } else {
        displayCards = currentTcgDataSet.fullArts.length ? currentTcgDataSet.fullArts : currentTcgDataSet.otherVariants;
        isShowingOther = (currentTcgDataSet.fullArts.length === 0);
      }

      renderTcgCards(displayCards, isShowingOther);
    }

    async function fetchTcgCards(pokeName, speciesName) {
      const requestId = ++activeTcgRequestId;
      const strip = document.getElementById('tcgStrip');
      const countText = document.getElementById('tcgCountText');
      
      const cleanName = getCleanNationalDexName(pokeName, speciesName);
      const cacheKey = `tcg_strict_exclusive_v140_${cleanName.toLowerCase()}`;
      
      if (memoryTcgCache.has(cacheKey)) {
        const cached = memoryTcgCache.get(cacheKey);
        currentTcgDataSet = cached;
        if (!isSpinning && requestId === activeTcgRequestId) {
          renderActiveTcgDisplay();
        }
        return;
      }

      const stored = localStorage.getItem(cacheKey);
      if (stored) {
        const cached = JSON.parse(stored);
        memoryTcgCache.set(cacheKey, cached);
        currentTcgDataSet = cached;
        if (!isSpinning && requestId === activeTcgRequestId) {
          renderActiveTcgDisplay();
        }
        return;
      }

      if (!isSpinning) {
        countText.innerText = "Loading cards...";
        strip.innerHTML = `
          <div class="tcg-skeleton-card"></div>
          <div class="tcg-skeleton-card"></div>
          <div class="tcg-skeleton-card"></div>
          <div class="tcg-skeleton-card"></div>
        `;
      }

      const primaryTerm = cleanName.split(' ')[0];

      const pokemontcgPromise = (async () => {
        const queryUrl = `https://api.pokemontcg.io/v2/cards?q=name:*${encodeURIComponent(primaryTerm)}*&select=id,name,images,set,number,rarity,subtypes&pageSize=175&orderBy=-set.releaseDate`;
        const res = await fetch(queryUrl);
        if (!res.ok) throw new Error("API error");
        const json = await res.json();
        return json.data || [];
      })();

      const tcgdexPromise = (async () => {
        const res = await fetch(`https://api.tcgdex.net/v2/en/cards?name=${encodeURIComponent(primaryTerm)}`);
        if (!res.ok) throw new Error("TCGdex error");
        const json = await res.json();
        if (!Array.isArray(json)) return [];
        return json.map(c => ({
          id: c.id,
          name: c.name,
          images: { small: `${c.image}/low.webp`, large: `${c.image}/high.webp` },
          set: { name: resolveSetName(c.set?.name || c.set?.id), id: c.set?.id || '', printedTotal: c.set?.cardCount?.official || 0 },
          number: c.localId || '?',
          rarity: c.rarity || 'Card',
          subtypes: []
        })).filter(c => c.images.small && !c.images.small.includes('undefined'));
      })();

      try {
        let allCards = [];
        try {
          allCards = await Promise.race([
            pokemontcgPromise,
            new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), 2800))
          ]);
        } catch (e) {
          allCards = await tcgdexPromise.catch(() => []);
          if (!allCards.length) {
            allCards = await pokemontcgPromise.catch(() => []);
          }
        }

        const speciesCards = allCards.filter(c => {
          const cardName = (c.name || '').toLowerCase();
          const target = cleanName.toLowerCase();
          return cardName.includes(target);
        });

        const fullArts = [];
        const otherVariants = [];

        speciesCards.forEach(c => {
          const tier = evaluateCardTier(c);
          const formatted = {
            id: c.id,
            name: c.name,
            smallImg: c.images?.small || '',
            largeImg: c.images?.large || c.images?.small || '',
            setName: resolveSetName(c.set),
            number: c.number || '?',
            rarity: c.rarity || 'Card',
            rank: tier.rank
          };

          if (formatted.smallImg) {
            if (tier.category === 'fullArts') {
              fullArts.push(formatted);
            } else {
              otherVariants.push(formatted);
            }
          }
        });

        fullArts.sort((a, b) => a.rank - b.rank);
        otherVariants.sort((a, b) => a.rank - b.rank);

        currentTcgDataSet = { fullArts, otherVariants };
        memoryTcgCache.set(cacheKey, currentTcgDataSet);
        try { localStorage.setItem(cacheKey, JSON.stringify(currentTcgDataSet)); } catch (e) {}
        
        if (!isSpinning && requestId === activeTcgRequestId) {
          renderActiveTcgDisplay();
        }
      } catch (err) {
        if (!isSpinning && requestId === activeTcgRequestId) {
          currentTcgDataSet = { fullArts: [], otherVariants: [] };
          renderTcgCards([], false);
        }
      }
    }

    function renderTcgCards(cards, isShowingOther = false) {
      const strip = document.getElementById('tcgStrip');
      const countText = document.getElementById('tcgCountText');

      if (!cards || !cards.length) {
        countText.innerText = "0 Cards";
        strip.innerHTML = '<div class="tcg-empty-msg">No cards found</div>';
        return;
      }

      countText.innerText = `${cards.length} Card${cards.length === 1 ? '' : 's'}`;
      strip.innerHTML = '';
      
      cards.forEach(card => {
        const node = document.createElement('div');
        node.className = 'tcg-card-item';
        node.innerHTML = `
          <div class="tcg-thumb-frame">
            <img class="tcg-card-thumb" src="${card.smallImg}" loading="lazy" alt="${card.name}" />
          </div>
          <div class="tcg-card-set" title="${card.setName}">${card.setName}</div>
          <div class="tcg-card-num">#${card.number}</div>
        `;
        
        node.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
        node.addEventListener('touchend', e => e.stopPropagation(), { passive: true });
        node.onclick = (e) => {
          e.stopPropagation();
          openTcgZoom(card);
        };
        
        strip.appendChild(node);
      });
    }

    async function loadPoke(id, dir = 0, log = false) {
      document.getElementById('sList').style.display = 'none';
      const input = document.getElementById('sInput'); if (input) { input.value = ''; input.blur(); }
      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        const data = await res.json();
        const targetDeg = (360 - (TYPES.indexOf(data.types[0].type.name) * 20 + 10)) % 360;
        const w = document.getElementById('wheel'); w.style.transition = 'none';
        rot = targetDeg; w.style.transform = `rotate(${rot}deg)`;
        renderCard(data, dir, false);
        if (log) addRec(data);
      } catch (e) { console.error(e); }
    }

      if (next < 1) next = TOTAL; if (next > TOTAL) next = 1;

    }

    async function spinAndPick() {
      initAudio();
      document.getElementById('sList').style.display = 'none';
      const btn = document.getElementById('spinBtn'), w = document.getElementById('wheel');
      btn.disabled = true;
      isSpinning = true;

      hideActive();

      const idx = Math.floor(Math.random() * TYPES.length);
      const targetDeg = (360 - (idx * 20 + 10)) % 360;
      w.style.transition = 'transform 3.2s cubic-bezier(0.12, 0.9, 0.18, 1)';
      rot += (Math.floor(Math.random() * 3) + 4) * 360 + ((targetDeg - (rot % 360) + 360) % 360);
      w.style.transform = `rotate(${rot}deg)`;
      
      let delay = 0, iv = 45;
      while (delay < 3000) { setTimeout(playTick, delay); delay += iv; iv *= 1.1; }

      try {
        const tRes = await fetch(`https://pokeapi.co/api/v2/type/${TYPES[idx]}`);
        const tData = await tRes.json();
        const valid = tData.pokemon.filter(p => parseInt(p.pokemon.url.split('/').filter(Boolean).pop()) <= TOTAL);
        const pRes = await fetch(valid[Math.floor(Math.random() * valid.length)].pokemon.url);
        const pData = await pRes.json();
        const shiny = Math.floor(Math.random() * 100) === 0;

        fetchTcgCards(pData.name, pData.species?.name);
        fetchLoreAndEvolution(pData.species?.url, pData.id);

        setTimeout(() => {
          isSpinning = false;
          renderCard(pData, 0, shiny, false);
          addRec(pData);
          playCry();
          if (shiny) triggerSparkle();
          btn.disabled = false;
        }, 3200);
      } catch (e) { 
        console.error(e);
        isSpinning = false;
        btn.disabled = false; 
      }
    }

    function renderCard(p, dir = 0, shiny = false) {
      curId = p.id; curPoke = p; isShiny = shiny;
      document.body.classList.add('has-active');
      const card = document.getElementById('pokeCard');
      document.getElementById('dexNum').innerText = `#${String(p.id).padStart(4,'0')}`;
      
      const cleanName = getCleanNationalDexName(p.name, p.species?.name);
      document.getElementById('pokeName').innerText = cleanName;
      updateArt();
      updateCardAura(p.types);

      // Default to Full Arts mode
      currentTcgMode = 'fullArts';
      updateTcgToggleUI();

      fetchLoreAndEvolution(p.species?.url, p.id);
      fetchTcgCards(p.name, p.species?.name);
      
      const tBox = document.getElementById('pokeTypes');
      tBox.innerHTML = '';
      p.types.forEach(t => {
        const pill = document.createElement('span');
        pill.className = 'pill'; pill.innerText = t.type.name;
        pill.style.backgroundColor = COLORS[t.type.name] || '#334155';
        tBox.appendChild(pill);
      });

      document.getElementById('sH').innerText = `${p.height / 10} m`;
      document.getElementById('sW').innerText = `${p.weight / 10} kg`;
      const st = {}; p.stats.forEach(s => st[s.stat.name] = s.base_stat);
      document.getElementById('sHp').innerText = st.hp || '-';
      document.getElementById('sAtk').innerText = st.attack || '-';
      document.getElementById('sDef').innerText = st.defense || '-';
      document.getElementById('sSpd').innerText = st.speed || '-';
      updateBtn(getCol().has(p.id));
      card.style.display = 'block';
    }

    let tX = 0, tY = 0, isSwipeRestricted = false;
    const cardEl = document.getElementById('pokeCard');
    
    cardEl.addEventListener('touchstart', e => { 
      isSwipeRestricted = Boolean(e.target.closest('#tcgWrap, #tcgStrip, #evoChain'));
      tX = e.changedTouches[0].screenX; 
      tY = e.changedTouches[0].screenY; 
    }, { passive: true });

    cardEl.addEventListener('touchend', e => {
      if (isSwipeRestricted || Boolean(e.target.closest('#tcgWrap, #tcgStrip, #evoChain'))) {
        return;
      }

      const dX = e.changedTouches[0].screenX - tX;
      const dY = e.changedTouches[0].screenY - tY;
      if (Math.abs(dX) > 40 && Math.abs(dX) > Math.abs(dY) * 1.3) {
        navigateDex(dX < 0 ? 1 : -1);
      }
    }, { passive: true });

    const tcgStripEl = document.getElementById('tcgStrip');
    tcgStripEl.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
    tcgStripEl.addEventListener('touchmove', e => e.stopPropagation(), { passive: true });
    tcgStripEl.addEventListener('touchend', e => e.stopPropagation(), { passive: true });

    document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) document.getElementById('sList').style.display = 'none'; });

    (async () => {
      buildIcons();
      updateCounts();
      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=${TOTAL}`);
        const data = await res.json();
        dir = data.results.map((p, i) => ({ id: i + 1, name: p.name }));
      } catch (e) {}
    })();
  </script>
</body>
</html>
